name: Generate StreamLine EPG

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-streamline-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate StreamLine EPG
        run: |
          python3 generate_streamline_epg.py

      - name: Validate output file
        run: |
          ls -lh StreamLine_epg.xml.gz
          python3 - <<'PY'
          from pathlib import Path
          p = Path('StreamLine_epg.xml.gz')
          if not p.exists() or p.stat().st_size == 0:
              raise SystemExit('StreamLine_epg.xml.gz is missing or empty')
          print(f'Generated file size: {p.stat().st_size} bytes')
          PY

      - name: Commit and push generated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add --all --force "StreamLine_epg.xml.gz"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          git commit -m "chore: update StreamLine EPG ($DATE)"
          git push origin HEAD:${GITHUB_REF_NAME}
